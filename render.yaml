# One-click deploy config for Render (https://render.com).
# New > Blueprint > point at this repo. Then paste the two Supabase values in.
services:
  - type: web
    name: wvdot-roadworks
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Project Settings > API in Supabase.
      - key: SUPABASE_URL
        sync: false
      # The service_role key, not anon. Server-side only — never ship it to the client.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
