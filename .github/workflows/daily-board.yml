name: Generate the daily work board

on:
  schedule:
    # GitHub cron is UTC and does not follow daylight saving, and its scheduler
    # regularly fires 10-30 minutes late under load. So rather than aim at one
    # time, the board is built repeatedly through the early morning: whichever
    # run lands first publishes, and the rest are cheap no-ops. Generation is
    # seeded by the date, so re-running produces the identical board.
    - cron: '5 8 * * *'     # ~4am ET
    - cron: '5 9 * * *'
    - cron: '5 10 * * *'    # ~6am EDT
    - cron: '5 11 * * *'    # ~6am EST
    - cron: '5 13 * * *'
    - cron: '5 16 * * *'    # last resort
  workflow_dispatch:
    inputs:
      date:
        description: 'Board date (YYYY-MM-DD). Blank means today.'
        required: false

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build the board and push it to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            node ingest/generate.js --date=${{ inputs.date }}
          else
            node ingest/generate.js
          fi
