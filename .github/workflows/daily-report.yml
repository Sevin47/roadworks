name: Ingest WV511 daily road report

on:
  schedule:
    # WVDOH posts the day's reports in the early morning. Run a few times so a
    # late-posting district still lands, and so a transient WV511 outage isn't
    # the whole day. Cron here is UTC; these are roughly 6/8/11am Eastern.
    - cron: '20 10 * * *'
    - cron: '20 12 * * *'
    - cron: '20 15 * * *'
  workflow_dispatch:        # lets you kick it off by hand from the Actions tab

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Parse reports and push the board to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node ingest/push.js
